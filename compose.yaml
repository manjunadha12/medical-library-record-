services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - medical_files:/app/backend/uploads
      - signing_keys:/app/backend/keys_store

volumes:
  medical_files:
  signing_keys:
